[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autourgos-toolbox"
version = "3.0.0"
description = "Dynamic lazy-loading toolbox middleware for Autourgos agents — keeps context windows clean by loading tools only when needed."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Jitin Kumar Sengar", email = "devxjitin@gmail.com"}
]
keywords = ["autourgos", "agent", "middleware", "toolbox", "llm", "tools", "lazy-loading"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = ["autourgos-react-agent>=1.6.0"]

[project.urls]
Homepage = "https://github.com/devxjitin/autourgos-toolbox"
Repository = "https://github.com/devxjitin/autourgos-toolbox"
Issues = "https://github.com/devxjitin/autourgos-toolbox/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["autourgos_toolbox*"]

[tool.setuptools.package-data]
autourgos_toolbox = ["py.typed"]
